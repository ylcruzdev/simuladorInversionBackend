services:
  api:
    build: .
    container_name: fastapi_backend_dev
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - backend_net

  mongo:
    image: mongo:7
    container_name: mongodb_dev
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
